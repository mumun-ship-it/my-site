<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>デッキルーレット</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;

    max-width: 840px;
    margin: 30px auto;
    padding: 0 20px;

    color: #2c3e50;
    background: #f8f9fa;
}

h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 24px;
    text-align: center;
    color: #1a252f;
    letter-spacing: 1px;
}

/* =========================
   レイアウト
========================= */

.app-container {
    display: flex;
    gap: 24px;
    align-items: flex-start;
}

.main-sec {
    flex: 1;
    min-width: 0;
}

.side-sec {
    width: 260px;
    flex-shrink: 0;

    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;

    padding: 18px;
    height: fit-content;
}

.side-sec h2 {
    font-size: 14px;
    font-weight: 700;

    margin: 0 0 12px;
    padding-bottom: 8px;

    border-bottom: 1px solid #e2e8f0;
    color: #4a5568;
}

/* =========================
   プレイヤー設定
========================= */

#playerList {
    max-height: 480px;
    overflow-y: auto;
    padding-right: 4px;
    margin-bottom: 12px;
}

#playerList::-webkit-scrollbar {
    width: 6px;
}
#playerList::-webkit-scrollbar-thumb {
    background: #cbd5e0;
    border-radius: 3px;
}
#playerList::-webkit-scrollbar-track {
    background: #edf2f7;
}

.player-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;

    padding: 14px 16px;
    margin-bottom: 12px;

    width: 100%;
}

.card-title {
    font-size: 13px;
    font-weight: 700;

    color: #718096;

    border-bottom: 1px solid #edf2f7;

    padding-bottom: 6px;
    margin-bottom: 10px;

    text-transform: uppercase;
    letter-spacing: 0.5px;
}

label {
    display: block;

    font-size: 12px;
    font-weight: 600;

    margin: 10px 0 4px;

    color: #4a5568;
}

input[type="text"],
select {
    width: 100%;

    padding: 9px 12px;

    font-size: 14px;

    border: 1px solid #cbd5e0;
    border-radius: 6px;

    background: #fff;
    color: #2d3748;

    transition:
        border-color 0.15s ease;
}

input[type="text"]:focus,
select:focus {
    outline: none;
    border-color: #4299e1;
}

.mode-select {
    margin: 10px 0 6px;
}

.mode-select label {
    display: inline-flex;

    align-items: center;
    gap: 6px;

    font-weight: 500;

    margin-right: 16px;

    cursor: pointer;
}

.hero-box {
    margin-top: 8px;
    display: none;
}

/* =========================
   名前プリセット機能
========================= */

.preset-box {
    margin-top: 16px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    background: #fff;
}

.preset-box summary {
    padding: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: #4a5568;
}

.preset-list-container {
    padding: 10px;
    border-top: 1px solid #edf2f7;
}

.preset-rotate-controls {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
    align-items: center;
}

.btn-rotate {
    flex: 1;
    padding: 5px;
    font-size: 11px;
    font-weight: 600;
    background: #edf2f7;
    border: 1px solid #cbd5e0;
    border-radius: 4px;
    cursor: pointer;
    color: #4a5568;
    text-align: center;
    transition: background 0.15s ease;
}

.btn-rotate:hover {
    background: #e2e8f0;
}

.preset-row {
    display: flex;
    align-items: center;
    gap: 3px;
    margin-bottom: 6px;
}

.preset-row.locked {
    background-color: #f7fafc;
    border-radius: 4px;
}

.preset-num {
    font-size: 11px;
    font-weight: 700;
    color: #718096;
    width: 16px;
    text-align: right;
}

.preset-input {
    flex: 1;
    min-width: 0;
    padding: 5px 6px !important;
    font-size: 12px !important;
}

.preset-btn-mini {
    padding: 3px 4px;
    font-size: 10px;
    background: #edf2f7;
    border: 1px solid #cbd5e0;
    border-radius: 4px;
    cursor: pointer;
    line-height: 1;
    color: #4a5568;
    flex-shrink: 0;
}

.preset-btn-mini:hover {
    background: #e2e8f0;
}

.preset-btn-lock {
    padding: 3px 4px;
    font-size: 11px;
    border: 1px solid #cbd5e0;
    border-radius: 4px;
    cursor: pointer;
    line-height: 1;
    background: #edf2f7;
    flex-shrink: 0;
}

.preset-btn-lock.is-locked {
    background: #feebc8;
    border-color: #fbd38d;
}

.btn-update-names {
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    background: #319795;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    transition: background 0.15s ease;
}

.btn-update-names:hover {
    background: #2c7a7b;
}

/* =========================
   確率設定
========================= */

.probability-box {
    margin-top: 16px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    background: #fff;
}

.probability-box summary {
    padding: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: #4a5568;
}

.probability-list {
    padding: 10px;
    border-top: 1px solid #edf2f7;
}

.prob-item {
    margin-bottom: 12px;
}

.prob-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 600;
    color: #4a5568;
    margin-bottom: 5px;
}

.prob-value {
    font-size: 11px;
    color: #718096;
}

.prob-slider {
    width: 100%;
    margin: 0;
    cursor: pointer;
}

.prob-scale {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: #a0aec0;
    padding: 0 2px;
}

.reset-btn {
    width: 100%;
    margin-top: 10px;
    padding: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    background: #edf2f7;
    color: #4a5568;
    border: none;
    border-radius: 4px;
}

/* =========================
   START
========================= */

.btn-start {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    background: #2b6cb0;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 12px;
    transition: background-color 0.15s ease;
}

.btn-start:hover {
    background: #2c5282;
}

.btn-start:disabled {
    background: #a0aec0;
    cursor: not-allowed;
}

/* =========================
   演出ON/OFF & モード選択
========================= */

.effect-option {
    margin-top: 16px;
    padding: 12px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    background: #fff;
}

.effect-option label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    cursor: pointer;
}

/* 初期状態では非表示 */
.effect-details {
    display: none;
}

.roulette-mode-group {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed #cbd5e0;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.roulette-mode-group label {
    font-size: 11px;
    font-weight: 600;
}

/* 初期状態では非表示（ドパガキ版選択時のみ表示） */
.target-hero-box {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid #edf2f7;
    display: none;
}

.target-hero-box label {
    font-size: 11px;
    color: #e53e3e;
    font-weight: 700;
    margin-bottom: 4px;
}

.luciano-hugu-option {
    margin-top: 6px;
    font-size: 11px;
    color: #2b6cb0;
    font-weight: 600;
}

/* =========================
   結果
========================= */

#resultArea {
    margin-top: 28px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
    align-items: start;
}

.player-res {
    position: relative;
    background: #ffffff;
    border: 3px solid #e2e8f0;
    border-radius: 12px;
    padding: 14px 16px 16px;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
}

.player-res.team-red {
    border-color: #e53e3e;
}

.player-res.team-blue {
    border-color: #3182ce;
}

/* =========================
   結果ヘッダー
========================= */

.res-header {
    border-bottom: 1px solid #edf2f7;
    padding-bottom: 10px;
    margin-bottom: 10px;
    position: relative;
}

.res-pname {
    font-size: 11px;
    font-weight: 600;
    color: #718096;
    letter-spacing: 0.5px;
    display: block;
    margin-bottom: 5px;
}

.res-hero {
    font-size: 18px;
    font-weight: 700;
    color: #1a202c;
    line-height: 1.35;
    min-height: 48px;
    display: flex;
    align-items: center;
    word-break: break-word;
}

/* =========================
   リロールボタン
========================= */

.result-actions {
    display: flex;
    justify-content: flex-end;
    gap: 5px;
    margin-bottom: 10px;
}

.btn-reroll-hero,
.btn-reroll-card {
    border: 1px solid #cbd5e0;
    background: #f7fafc;
    color: #4a5568;
    border-radius: 5px;
    padding: 4px 7px;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
}

.btn-reroll-hero:hover,
.btn-reroll-card:hover {
    background: #edf2f7;
    border-color: #a0aec0;
}

/* =========================
   カード結果
========================= */

.res-cards {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.card-row {
    display: flex;
    align-items: center;
    border-radius: 5px;
    overflow: hidden;
    min-height: 38px;
}

.card-num {
    width: 30px;
    min-width: 30px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    background: rgba(0, 0, 0, 0.15);
    color: #ffffff;
}

.card-label {
    flex: 1;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    color: #ffffff;
    display: flex;
    align-items: center;
    min-height: 38px;
}

/* =========================
   カードタイプ色
========================= */

.type-近距離 .card-row, .type-近距離.roulette-slot, .slot-box.type-近距離 { background: #e53e3e !important; border-color: #c53030 !important; color: #fff !important; }
.type-遠距離 .card-row, .type-遠距離.roulette-slot, .slot-box.type-遠距離 { background: #dd6b20 !important; border-color: #c05621 !important; color: #fff !important; }
.type-連続 .card-row, .type-連続.roulette-slot, .slot-box.type-連続 { background: #9b2c2c !important; border-color: #742a2a !important; color: #fff !important; }
.type-周囲 .card-row, .type-周囲.roulette-slot, .slot-box.type-周囲 { background: #c05621 !important; border-color: #9c4221 !important; color: #fff !important; }
.type-回復 .card-row, .type-回復.roulette-slot, .slot-box.type-回復 { background: #38a169 !important; border-color: #2f855a !important; color: #fff !important; }
.type-ガード .card-row, .type-ガード.roulette-slot, .slot-box.type-ガード { background: #d69e2e !important; border-color: #b7791f !important; color: #fff !important; }
.type-強化 .card-row, .type-強化.roulette-slot, .slot-box.type-強化 { background: #00a3c4 !important; border-color: #0987a0 !important; color: #fff !important; }
.type-弱体化 .card-row, .type-弱体化.roulette-slot, .slot-box.type-弱体化 { background: #6b46c1 !important; border-color: #553c9a !important; color: #fff !important; }
.type-移動 .card-row, .type-移動.roulette-slot, .slot-box.type-移動 { background: #3182ce !important; border-color: #2b6cb0 !important; color: #fff !important; }
.type-設置 .card-row, .type-設置.roulette-slot, .slot-box.type-設置 { background: #234e52 !important; border-color: #1a3b3e !important; color: #fff !important; }
.type-カウンター .card-row, .type-カウンター.roulette-slot, .slot-box.type-カウンター { background: #d53f8c !important; border-color: #b83280 !important; color: #fff !important; }
.type-その他 .card-row, .type-その他.roulette-slot, .slot-box.type-その他 { background: #4a5568 !important; border-color: #2d3748 !important; color: #fff !important; }

/* =========================
   アニメーション
========================= */

.anim-fade {
    opacity: 0;
    transform: translateY(8px);
    animation: fadeIn 0.4s ease forwards;
}

@keyframes fadeIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   ルーレット Overlays
========================= */

#rouletteOverlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(15, 23, 42, 0.94);
    padding: 20px;
    overflow-y: auto;
    transition: background 0.2s ease;
}

#rouletteOverlay.blackout {
    background: #000000 !important;
}

#rouletteOverlay.show {
    display: flex;
}

.roulette-window {
    width: min(600px, 100%);
    background: #ffffff;
    border-radius: 18px;
    padding: 24px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    position: relative;
    transition: all 0.2s ease;
}

.roulette-player {
    font-size: 14px;
    color: #718096;
    margin-bottom: 8px;
}

.roulette-title {
    font-size: 18px;
    font-weight: 700;
    color: #2d3748;
    margin-bottom: 14px;
}

.roulette-slot {
    position: relative;
    min-height: 110px;
    height: auto;
    overflow: visible;
    border-radius: 12px;
    border: 2px solid #cbd5e0;
    background: #1a202c;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    transition: background-color 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
}

.roulette-value {
    font-size: clamp(18px, 4.5vw, 28px);
    font-weight: 800;
    color: #ffffff;
    padding: 6px 12px;
    word-break: break-all;
    overflow-wrap: anywhere;
    width: 100%;
    transition: color 0.12s ease, transform 0.2s ease;
}

.roulette-value.card-decided {
    font-size: clamp(24px, 6vw, 40px);
    font-weight: 900;
    transform: scale(1.05);
    line-height: 1.3;
    text-shadow: 0 3px 0 rgba(0,0,0,0.12), 0 0 20px rgba(255,255,255,0.55);
}

.roulette-value .final-deck-result {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
}

.roulette-value .final-hero-name {
    font-size: clamp(16px, 4vw, 22px);
    font-weight: 800;
    color: #ffd700;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}

.roulette-value .final-cards-list {
    font-size: clamp(13px, 3.2vw, 18px);
    font-weight: 700;
    line-height: 1.4;
    word-break: break-all;
    color: #ffffff;
}

.roulette-card-list {
    margin-top: 12px;
    font-size: 13px;
    color: #718096;
}

/* 同時並列スロット表示用 */
.multi-slot-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 12px;
}

.slot-box {
    border: 2px solid #4a5568;
    border-radius: 8px;
    background: #2d3748;
    padding: 8px;
    text-align: center;
    transition: all 0.1s ease;
}

.slot-box .slot-tag {
    font-size: 10px;
    font-weight: bold;
    color: #cbd5e0;
    margin-bottom: 2px;
    text-transform: uppercase;
}

.slot-box.type-hero {
    background: #2b6cb0;
    border-color: #3182ce;
}

.slot-box .slot-val {
    font-size: 15px;
    font-weight: 800;
    color: #ffffff;
    word-break: break-all;
}

.cards-4-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

/* ルーレット チーム色 */
.roulette-slot.team-red {
    background: #e53e3e;
    border-color: #c53030;
    box-shadow: 0 0 25px rgba(229, 62, 62, 0.45);
}

.roulette-slot.team-blue {
    background: #3182ce;
    border-color: #2b6cb0;
    box-shadow: 0 0 25px rgba(49, 130, 206, 0.45);
}

.roulette-slot.team-red .roulette-value,
.roulette-slot.team-blue .roulette-value {
    color: #ffffff;
}

/* スキップ */
.btn-skip {
    margin-top: 18px;
    padding: 9px 22px;
    border: none;
    border-radius: 999px;
    background: #2d3748;
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}

.btn-skip:hover {
    background: #1a202c;
}

/* アニメーション類 */
.roulette-glow {
    animation: rouletteGlow 0.18s infinite alternate;
}

@keyframes rouletteGlow {
    from { transform: scale(0.98); opacity: 0.75; }
    to { transform: scale(1.03); opacity: 1; }
}

/* ドパガキ連滅点滅強化 */
.dopagaki-flash-multi {
    animation: dopagakiMulti 0.15s ease infinite alternate !important;
}

@keyframes dopagakiMulti {
    0% { transform: scale(1); filter: brightness(1) drop-shadow(0 0 0px #fff); }
    25% { transform: scale(1.08); filter: brightness(2.2) drop-shadow(0 0 15px #ffff00); }
    50% { transform: scale(0.95); filter: brightness(0.8); }
    75% { transform: scale(1.12); filter: brightness(2.5) drop-shadow(0 0 25px #ff00ff); }
    100% { transform: scale(1.05); filter: brightness(1.8) drop-shadow(0 0 10px #00ffff); }
}

/* 当たりカード確定時の超弩級背景エフェクト */
.target-card-jackpot {
    animation: targetCardGigaFlash 0.08s infinite alternate !important;
}

@keyframes targetCardGigaFlash {
    0% { background-color: #234e52 !important; box-shadow: 0 0 40px #00ffff, inset 0 0 20px #ffffff; }
    100% { background-color: #00ffcc !important; box-shadow: 0 0 80px #ffffff, inset 0 0 40px #000000; }
}

/* スロカス特有演出スタイル */
.slokas-window {
    background: #000000 !important;
    border: 4px solid #ffd700 !important;
    box-shadow: 0 0 50px rgba(255, 215, 0, 0.8), inset 0 0 30px rgba(255, 0, 0, 0.5) !important;
    color: #ffffff !important;
}

.slokas-window .roulette-title {
    color: #ff0055 !important;
    font-size: 24px !important;
    font-weight: 900 !important;
    text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0000 !important;
}

.reach-banner {
    background: linear-gradient(90deg, #ff0000, #ff00ff, #00ffff, #ff0000);
    background-size: 300% 300%;
    animation: rainbow 0.5s infinite linear;
    color: #fff;
    font-size: 40px;
    font-weight: 900;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 12px;
    text-shadow: 2px 2px 0 #000, -2px -2px 0 #000;
}

/* 金色テキスト用（修正：color/fillの透明化を追加して黒文字化を防止） */
.gold-text {
    background: linear-gradient(180deg, #FFFFFF 0%, #FFD700 40%, #FF8C00 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: #ffd700 !important;
    -webkit-text-fill-color: #ffd700 !important;
    -webkit-text-stroke: 1px #fff3a0;
    display: inline-block;
    text-shadow: 0 0 8px rgba(255, 215, 0, 0.95), 0 2px 3px rgba(0,0,0,0.9);
    filter: none;
}

/* 虹色テキスト用 */
.rainbow-text {
    background: linear-gradient(to right, red, orange, yellow, green, cyan, blue, violet);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent !important;
    -webkit-text-fill-color: transparent !important;
    display: inline-block;
}

@keyframes rainbow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.rainbow-flash {
    animation: rainbowFlash 0.08s infinite !important;
}

@keyframes rainbowFlash {
    0% { background-color: #ff0000; }
    20% { background-color: #ffff00; }
    40% { background-color: #00ff00; }
    60% { background-color: #00ffff; }
    80% { background-color: #ff00ff; }
    100% { background-color: #ff0000; }
}

.luciano-text {
    font-size: 42px !important;
    font-weight: 900 !important;
    color: #ffffff;
    white-space: nowrap !important;
    word-break: keep-all !important;
    overflow-wrap: normal !important;
    display: inline-block;
    text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0055;

<script>

/* =========================================================
   基本データ
========================================================= */

let globalAllHeroes = [];

const cardTypes = [
    "近距離", "遠距離", "連続", "周囲",
    "回復", "ガード", "強化", "弱体化",
    "移動", "設置", "カウンター", "その他"
];

let probabilities = {};
cardTypes.forEach(type => {
    probabilities[type] = 3;
});

let namePresets = [
    { name: "名無し１", locked: false },
    { name: "名無し２", locked: false },
    { name: "name無し３", locked: false },
    { name: "名無し４", locked: false },
    { name: "名無し５", locked: false }
];

/* =========================================================
   UI制御（演出オプション開閉＆当たり枠制御）
========================================================= */

function toggleEffectOption() {
    const isChecked = document.getElementById("effectToggle").checked;
    const details = document.getElementById("effectDetails");
    details.style.display = isChecked ? "block" : "none";
    if (isChecked) {
        toggleTargetHeroBox();
    }
}

function toggleTargetHeroBox() {
    const mode = getSelectedRouletteMode();
    const box = document.getElementById("targetHeroBox");
    // ドパガキ版を選択時のみ当たり枠カードを表示
    box.style.display = (mode === "slokas") ? "block" : "none";
}

/* =========================================================
   音（通常／激熱サウンド効果）
========================================================= */

let audioContext = null;

function initAudio() {
    if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
            audioContext = new AudioCtx();
        }
    }
    if (audioContext && audioContext.state === "suspended") {
        audioContext.resume();
    }
}

function playTick(freq = 650) {
    if (!audioContext) return;
    try {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "square";
        oscillator.frequency.setValueAtTime(freq, audioContext.currentTime);
        gain.gain.setValueAtTime(0.035, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.045);

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.05);
    } catch(e){}
}

function playDecisionSound() {
    if (!audioContext) return;
    try {
        const now = audioContext.currentTime;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(520, now);
        oscillator.frequency.exponentialRampToValueAtTime(880, now + 0.12);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(now + 0.26);
    } catch(e){}
}

/* 文字表示音 */
function playCharSound() {
    if (!audioContext) return;
    try {
        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1760, now + 0.08);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start(now);
        osc.stop(now + 0.1);
    } catch(e){}
}

/* 暗転（ピチュる）SE */
function playPichuSound() {
    if (!audioContext) return;
    try {
        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(2000, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start(now);
        osc.stop(now + 0.3);
    } catch(e){}
}

/* スロカス特有：ファンファーレ＆キュインSE */
function playSlokasKyuin() {
    if (!audioContext) return;
    try {
        const now = audioContext.currentTime;
        for(let i = 0; i < 8; i++) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(1400 + (i % 2) * 500, now + i * 0.05);
            gain.gain.setValueAtTime(0.2, now + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + (i + 1) * 0.05);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start(now + i * 0.05);
            osc.stop(now + (i + 1) * 0.05);
        }
    } catch(e){}
}

/* 当たり枠カード確定時の超弩級サウンド */
function playTargetCardJackpotSound() {
    if (!audioContext) return;
    try {
        const now = audioContext.currentTime;
        for (let i = 0; i < 12; i++) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(300 + (i * 120), now + i * 0.04);
            gain.gain.setValueAtTime(0.2, now + i * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + (i + 1) * 0.04);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start(now + i * 0.04);
            osc.stop(now + (i + 1) * 0.04);
        }
    } catch(e){}
}

/* 最終結果SE：ハッピー（当たり枠あり） */
function playHappyResultSE() {
    if (!audioContext) return;
    try {
        const now = audioContext.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.25, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.35);
        });
    } catch(e){}
}

/* ルチ不遇成功時専用：超豪華リザルトSE */
function playLucianoJackpotResultSE() {
    if (!audioContext) return;
    try {
        const now = audioContext.currentTime;
        const melody = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
        melody.forEach((freq, idx) => {
            [freq, freq * 1.5].forEach((f, layer) => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = layer === 0 ? "sawtooth" : "triangle";
                const t = now + idx * 0.11;
                osc.frequency.setValueAtTime(f, t);
                gain.gain.setValueAtTime(layer === 0 ? 0.18 : 0.11, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start(t);
                osc.stop(t + 0.43);
            });
        });
        for (let i = 0; i < 3; i++) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const t = now + 0.72 + i * 0.08;
            osc.type = "square";
            osc.frequency.setValueAtTime(180 + i * 120, t);
            gain.gain.setValueAtTime(0.22, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.start(t); osc.stop(t + 0.26);
        }
    } catch(e){}
}

/* ドパガキ版：当たりなし専用「デデン↓」 */
function playDedennResultSE() {
    if (!audioContext) return;
    try {
        const now = audioContext.currentTime;
        const notes = [293.66, 220.00]; // D4 -> A3
        notes.forEach((freq, idx) => {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const t = now + idx * 0.22;
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.24, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.start(t); osc.stop(t + 0.4);
        });
    } catch(e){}
}

/* 最終結果SE：通常版用（明るい決定音） */
function playNormalResultSE() {
    if (!audioContext) return;
    try {
        const now = audioContext.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const t = now + idx * 0.09;
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start(t);
            osc.stop(t + 0.31);
        });
    } catch(e){}
}

/* =========================================================
   名前プリセット管理機能
========================================================= */

function loadPresets() {
    const saved = localStorage.getItem("deckRoulettePresets");
    if (saved) {
        try {
            const raw = JSON.parse(saved);
            namePresets = raw.map(item => {
                if (typeof item === "string") {
                    return { name: item, locked: false };
                }
                return item;
            });
        } catch (e) {
            console.error(e);
        }
    }
}

function savePresets() {
    localStorage.setItem("deckRoulettePresets", JSON.stringify(namePresets));
}

function renderPresets() {
    const container = document.getElementById("presetList");
    if (!container) return;

    container.innerHTML = "";

    namePresets.forEach((item, idx) => {
        const row = document.createElement("div");
        row.className = `preset-row ${item.locked ? 'locked' : ''}`;

        const lockIcon = item.locked ? "🔒" : "🔓";
        const lockTitle = item.locked ? "固定ON（解除する）" : "固定OFF（固定する）";

        row.innerHTML = `
            <div class="preset-num">${idx + 1}</div>
            <button type="button" class="preset-btn-lock ${item.locked ? 'is-locked' : ''}" onclick="togglePresetLock(${idx})" title="${lockTitle}">${lockIcon}</button>
            <input type="text" class="preset-input" value="${escapeHtml(item.name)}" onchange="updatePresetValue(${idx}, this.value)">
            <button type="button" class="preset-btn-mini" onclick="movePresetUp(${idx})" title="ひとつ上と入替">↑</button>
            <button type="button" class="preset-btn-mini" onclick="movePresetDown(${idx})" title="ひとつ下と入替">↓</button>
            <button type="button" class="preset-btn-mini" onclick="addPresetRow(${idx})" title="下に挿入">＋</button>
            <button type="button" class="preset-btn-mini" onclick="deletePresetRow(${idx})" title="削除">🗑️</button>
        `;
        container.appendChild(row);
    });
}

function togglePresetLock(idx) {
    namePresets[idx].locked = !namePresets[idx].locked;
    savePresets();
    renderPresets();
}

function updatePresetValue(idx, val) {
    namePresets[idx].name = val;
    savePresets();
}

function movePresetUp(idx) {
    if (idx <= 0) return;
    if (namePresets[idx].locked || namePresets[idx - 1].locked) {
        alert("固定されている項目は位置を変更できません。");
        return;
    }
    const temp = namePresets[idx];
    namePresets[idx] = namePresets[idx - 1];
    namePresets[idx - 1] = temp;
    savePresets();
    renderPresets();
}

function movePresetDown(idx) {
    if (idx >= namePresets.length - 1) return;
    if (namePresets[idx].locked || namePresets[idx + 1].locked) {
        alert("固定されている項目は位置を変更できません。");
        return;
    }
    const temp = namePresets[idx];
    namePresets[idx] = namePresets[idx + 1];
    namePresets[idx + 1] = temp;
    savePresets();
    renderPresets();
}

function rotatePresetUp() {
    const unlockedIndices = [];
    const unlockedValues = [];

    namePresets.forEach((item, idx) => {
        if (!item.locked) {
            unlockedIndices.push(idx);
            unlockedValues.push(item);
        }
    });

    if (unlockedValues.length <= 1) return;

    const first = unlockedValues.shift();
    unlockedValues.push(first);

    unlockedIndices.forEach((targetIdx, i) => {
        namePresets[targetIdx] = unlockedValues[i];
    });

    savePresets();
    renderPresets();
}

function rotatePresetDown() {
    const unlockedIndices = [];
    const unlockedValues = [];

    namePresets.forEach((item, idx) => {
        if (!item.locked) {
            unlockedIndices.push(idx);
            unlockedValues.push(item);
        }
    });

    if (unlockedValues.length <= 1) return;

    const last = unlockedValues.pop();
    unlockedValues.unshift(last);

    unlockedIndices.forEach((targetIdx, i) => {
        namePresets[targetIdx] = unlockedValues[i];
    });

    savePresets();
    renderPresets();
}

function addPresetRow(idx) {
    namePresets.splice(idx + 1, 0, { name: `名無し${namePresets.length + 1}`, locked: false });
    savePresets();
    renderPresets();
}

function deletePresetRow(idx) {
    if (namePresets.length <= 1) {
        alert("プリセットは最低1つ残す必要があります。");
        return;
    }
    namePresets.splice(idx, 1);
    savePresets();
    renderPresets();
}

function applyPresetNames() {
    const inputs = document.querySelectorAll("#playerList .p-name");
    inputs.forEach((input, idx) => {
        if (idx < namePresets.length) {
            input.value = namePresets[idx].name;

        }

}

function getProbabilityWeight(level) {
    return (level - 1) * 5;
}

}

    });

}

/* =========================================================
   重み付き抽選
========================================================= */

function pickWeightedCard() {
    const entries = cardTypes
        .map(type => ({ type, weight: getProbabilityWeight(probabilities[type]) }))
        .filter(item => item.weight > 0);

    if (entries.length === 0) {
        return cardTypes[Math.floor(Math.random() * cardTypes.length)];
    }

    const total = entries.reduce((sum, item) => sum + item.weight, 0);
    let random = Math.random() * total;

    for (const item of entries) {
        random -= item.weight;
        if (random <= 0) return item.type;
    }

    return entries[entries.length - 1].type;
}

function createCards() {
    const pickedCards = [];
    for (let i = 0; i < 4; i++) {

}

========================================================= */

function getTeamAssignments(total) {
    const redCount = Math.ceil(total / 2);
    const teams = [];

    for (let i = 0; i < redCount; i++) teams.push("red");
    for (let i = redCount; i < total; i++) teams.push("blue");

    for (let i = teams.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [teams[i], teams[j]] = [teams[j], teams[i]];
    }

    return teams;
}

/* =========================================================
   ルーレット制御
========================================================= */

let rouletteSkipRequested = false;

function skipRoulette() { rouletteSkipRequested = true; }
function resetRouletteSkip() { rouletteSkipRequested = false; }

async function rouletteWait(ms) {
    const step = 30;
    let elapsed = 0;
    while (elapsed < ms && !rouletteSkipRequested) {
        const current = Math.min(step, ms - elapsed);
        await wait(current);
        elapsed += current;
    }
}

async function holdRouletteResult(ms) {
    const elapsedStep = 50;
    let elapsed = 0;
    while (elapsed < ms) {
        if (rouletteSkipRequested) {
            rouletteSkipRequested = false;
            return;
        }
        const current = Math.min(elapsedStep, ms - elapsed);
        await wait(current);
        elapsed += current;
    }
}

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function setRouletteColor(className) {
    const slot = document.getElementById("rouletteSlot");
    slot.className = "roulette-slot";
    if (className) slot.classList.add(className);
}

function getSelectedRouletteMode() {
    const checked = document.querySelector('input[name="rouletteMode"]:checked');
    return checked ? checked.value : "normal";
}

function prepareRouletteUI(mode) {
    const win = document.getElementById("rouletteWindow");
    const reach = document.getElementById("reachBanner");
    const single = document.getElementById("singleSlotContainer");
    const multi = document.getElementById("multiSlotContainer");
    const overlay = document.getElementById("rouletteOverlay");

    win.classList.remove("slokas-window");
    overlay.classList.remove("blackout");
    reach.style.display = "none";

    if (mode === "short") {
        single.style.display = "none";
        multi.style.display = "grid";
    } else {
        single.style.display = "block";
        multi.style.display = "none";
        if (mode === "slokas") {
            win.classList.add("slokas-window");
        }
    }
}

async function rouletteSlokasAnimation(player, rerollPart = "all") {
    resetRouletteSkip();
    prepareRouletteUI("slokas");

    const overlay = document.getElementById("rouletteOverlay");
    const win = document.getElementById("rouletteWindow");
    const pEl = document.getElementById("roulettePlayer");
    const titleEl = document.getElementById("rouletteTitle");
    const valueEl = document.getElementById("rouletteValue");
    const cardList = document.getElementById("rouletteCardList");
    const reach = document.getElementById("reachBanner");
    const slot = document.getElementById("rouletteSlot");
    const targetHero = "ルチアーノ";
    const targetCard = document.getElementById("targetCardSelect").value || "設置";

    pEl.textContent = `🔔 ${player.name} 🔔`;
    titleEl.textContent = "";
    cardList.textContent = "";

    overlay.classList.add("show");

    // 1. ヒーロー高速回転＆確定
    if (rerollPart !== "cards") {
    setRouletteColor(`team-${player.team}`);
    for (let i = 0; i < 18; i++) {
        if (rouletteSkipRequested) break;
        valueEl.textContent = globalAllHeroes[Math.floor(Math.random() * globalAllHeroes.length)];
        playTick(1200);
        await rouletteWait(60);
    }
    
    // ルチアーノ（当たりヒーロー）当選時の暗転演出
    if (player.heroResult === targetHero) {
        overlay.classList.add("blackout");
        valueEl.textContent = "";
        playPichuSound();
        await rouletteWait(800);

        overlay.classList.remove("blackout");

        const charList = Array.from(targetHero);
        let displayed = "";
        
        for (let c of charList) {
            if (rouletteSkipRequested) break;
            displayed += c;
            valueEl.innerHTML = `<span class="luciano-text">${displayed}</span>`;
            playCharSound();
            valueEl.classList.add("dopagaki-flash-multi");
            await rouletteWait(220);
            valueEl.classList.remove("dopagaki-flash-multi");
        }
        
        // 金色グラデーション文字（gold-text）を適用して「確定」を表示
        reach.style.display = "block";
        reach.innerHTML = `<span class="gold-text">🔥 確定 🔥</span>`;
        playSlokasKyuin();
        win.classList.add("rainbow-flash");
        valueEl.classList.add("dopagaki-flash-multi");
        
        await rouletteWait(800);
        win.classList.remove("rainbow-flash");
        valueEl.classList.remove("dopagaki-flash-multi");
        reach.style.display = "none";
    } else {
        valueEl.textContent = player.heroResult;
        // ドパガキ版のヒーロー確定も、カード確定時と同じ「ぴろりろり」
        playSlokasKyuin();
        valueEl.classList.add("dopagaki-flash-multi");
        await rouletteWait(400);
        valueEl.classList.remove("dopagaki-flash-multi");
    }

    }

    // ヒーローだけのリロールなら、ここで終了（カード演出はしない）
    if (rerollPart === "hero") {
        await holdRouletteResult(1000);
        overlay.classList.remove("show");
        return;
    }

    // 2. カード順次決定
    const cards = player.cardsResult;
    if (rerollPart === "cards") {
        titleEl.textContent = "CARD REROLL";
        valueEl.textContent = "";
        setRouletteColor("");
    }

    for (let i = 0; i < cards.length; i++) {
        titleEl.textContent = `CARD ${i+1} / 4`;

        for (let j = 0; j < 12; j++) {
            if (rouletteSkipRequested) break;
            const tmp = pickWeightedCard();
            valueEl.textContent = tmp;
            setRouletteColor(`type-${tmp}`);
            playTick(1000);
            await rouletteWait(55);
        }

        valueEl.textContent = cards[i];
        setRouletteColor(`type-${cards[i]}`);

        if (cards[i] === targetCard) {
            playTargetCardJackpotSound();
            slot.classList.add("target-card-jackpot");
            valueEl.classList.add("dopagaki-flash-multi");
            await rouletteWait(900);
            slot.classList.remove("target-card-jackpot");
            valueEl.classList.remove("dopagaki-flash-multi");
        } else {
            playSlokasKyuin();
            win.classList.add("rainbow-flash");
            await rouletteWait(300);
            win.classList.remove("rainbow-flash");
        }
    }

    titleEl.textContent = "";

    win.classList.add("rainbow-flash");

    // ルチ不遇ONでルチアーノ当選時は専用の超豪華リザルトSE
    const lucianoHuguSuccess = document.getElementById("lucianoHuguToggle").checked && player.heroResult === targetHero;
    if (lucianoHuguSuccess) {
        playLucianoJackpotResultSE();
    } else if (cards.includes(targetCard) || player.heroResult === targetHero) {
        playHappyResultSE();
    } else {
        // ドパガキ版で当たりなしだけ「デデン↓」
        playDedennResultSE();
    }

    valueEl.innerHTML = `
        <div class="final-deck-result">
            <div class="final-hero-name">【HERO】${escapeHtml(player.heroResult)}</div>
            <div class="final-cards-list">${cards.map(c => `[${escapeHtml(c)}]`).join(" ")}</div>
        </div>
    `;

    await holdRouletteResult(2500);
    win.classList.remove("rainbow-flash");
    reach.style.display = "none";
    overlay.classList.remove("show");
}

/* =========================================================
   全体抽選
========================================================= */

async function drawDeck() {
    initAudio();

    const count = parseInt(document.getElementById("memberCount").value, 10);
    const cards = document.querySelectorAll(".player-card");
    const resultBox = document.getElementById("resultArea");
    resultBox.innerHTML = "";

    const startBtn = document.getElementById("startBtn");
    startBtn.disabled = true;

    const players = [];
    const teamAssignments = getTeamAssignments(count);
    const isEffectOn = document.getElementById("effectToggle").checked;
    const rouletteMode = getSelectedRouletteMode();
    const isLucianoHuguOn = (rouletteMode === "slokas") && document.getElementById("lucianoHuguToggle").checked;
    const targetCard = document.getElementById("targetCardSelect").value || "設置";

    for (let i = 0; i < count; i++) {
        const card = cards[i];
        let name = card.querySelector(".p-name").value.trim();
        const mode = card.querySelector('input[type="radio"]:checked').value;
        const hero = card.querySelector(".p-hero").value;

        if (!name) {
            name = count === 1 ? "名無し" : `名無し${i + 1}`;
        }

        if (mode === "select" && !hero) {
            alert(`${i + 1}人目のキャラが選ばれてません！`);
            startBtn.disabled = false;
            return;
        }

        const heroResult = mode === "select" ? hero : globalAllHeroes[Math.floor(Math.random() * globalAllHeroes.length)];
        
        let cardsResult;
        // ドパガキ版かつ「ルチ不遇」ONでルチアーノ当選時、カード4枚すべて当たりカードに固定
        if (isLucianoHuguOn && heroResult === "ルチアーノ") {
            cardsResult = [targetCard, targetCard, targetCard, targetCard];
        } else {
            cardsResult = createCards();
        }

        const playerData = {
            index: i,
            name,
            mode,
            hero,
            heroResult,
            cardsResult,
            team: teamAssignments[i]
        };

        players.push(playerData);
    }

    for (let i = 0; i < players.length; i++) {
        const p = players[i];

        if (isEffectOn) {
            if (rouletteMode === "short") {
                await rouletteShortAnimation(p);
            } else if (rouletteMode === "slokas") {
                await rouletteSlokasAnimation(p);
            } else {
                await rouletteAnimation(
                    p.name,
                    p.mode === "random" ? "ヒーロー抽選" : "ヒーロー確認",
                    globalAllHeroes,
                    p.heroResult,
                    p.team
                );
                await rouletteCardsAnimation(p.name, p.heroResult, p.cardsResult);
            }
        }

        const pBlock = document.createElement("div");
        pBlock.className = `player-res anim-fade team-${p.team}`;
        pBlock.id = `resBlock_${p.index}`;
        pBlock.__playerData = p;

        resultBox.appendChild(pBlock);
        renderPlayerResult(p, pBlock);

        await wait(200);
    }

    saveLog(players);
    renderLogs();

    startBtn.disabled = false;
}

/* =========================================================
   ヒーローリロール
========================================================= */

async function rerollHero(index) {
    initAudio();

    const cards = document.querySelectorAll(".player-card");
    const card = cards[index];
    if (!card) return;

    const name = card.querySelector(".p-name").value.trim() || `名無し${index + 1}`;
    const mode = card.querySelector('input[type="radio"]:checked').value;
    const hero = globalAllHeroes[Math.floor(Math.random() * globalAllHeroes.length)];

    const target = document.getElementById(`resBlock_${index}`);
    if (!target) return;

    const current = target.__playerData || getPlayerDataFromResult(target, index, name);
    const finalHero = mode === "select" ? card.querySelector(".p-hero").value : hero;

    const rMode = getSelectedRouletteMode();
    const isLucianoHuguOn = (rMode === "slokas") && document.getElementById("lucianoHuguToggle").checked;
    const targetCard = document.getElementById("targetCardSelect").value || "設置";

    let updatedCards = current.cardsResult;
    // ルチ不遇がONで、リロールによりルチアーノに変化した場合はカード4枚を当たりカードに置き換え
    if (isLucianoHuguOn && finalHero === "ルチアーノ") {
        updatedCards = [targetCard, targetCard, targetCard, targetCard];
    }

    if (document.getElementById("effectToggle").checked) {
        if (rMode === "slokas") {
            await rouletteSlokasAnimation({ ...current, heroResult: finalHero, cardsResult: updatedCards }, "hero");
        } else if (rMode === "short") {
            // 短縮版はヒーロー専用の演出を呼び出し
            await rouletteShortHeroAnimation(name, finalHero);
        } else {
            await rouletteAnimation(
                name,
                mode === "select" ? "ヒーロー確認" : "ヒーローリロール",
                globalAllHeroes,
                finalHero,
                current.team
            );
        }
    }

    current.heroResult = finalHero;
    current.cardsResult = updatedCards;
    current.name = name;
    target.__playerData = current;

    renderPlayerResult(current, target);
    addRerollLog(index, "hero", finalHero);
}

/* =========================================================
   カードリロール
========================================================= */

async function rerollCards(index) {
    initAudio();

    const cards = document.querySelectorAll(".player-card");
    const card = cards[index];
    if (!card) return;

    const name = card.querySelector(".p-name").value.trim() || `名無し${index + 1}`;
    
    const target = document.getElementById(`resBlock_${index}`);
    if (!target) return;

    const current = target.__playerData || getPlayerDataFromResult(target, index, name);
    const rMode = getSelectedRouletteMode();
    const isLucianoHuguOn = (rMode === "slokas") && document.getElementById("lucianoHuguToggle").checked;
    const targetCard = document.getElementById("targetCardSelect").value || "設置";

    let newCards;
    // ルチ不遇がONでルチアーノ保持中の場合、カードリロール時も4枚当たりカードに統一
    if (isLucianoHuguOn && current.heroResult === "ルチアーノ") {
        newCards = [targetCard, targetCard, targetCard, targetCard];
    } else {
        newCards = createCards();
    }

    if (document.getElementById("effectToggle").checked) {
        if (rMode === "slokas") {
            await rouletteSlokasAnimation({ ...current, cardsResult: newCards }, "cards");
        } else if (rMode === "short") {
            // 短縮版はカード専用の演出を呼び出し
            await rouletteShortCardsAnimation(name, newCards);
        } else {
            await rouletteCardsAnimation(name, current.heroResult, newCards);
        }
    }

    current.cardsResult = newCards;
    current.name = name;
    target.__playerData = current;

    renderPlayerResult(current, target);
    addRerollLog(index, "cards", newCards);
}

/* =========================================================
   結果からデータ復元
========================================================= */

function getPlayerDataFromResult(target, index, name) {
    const hero = target.querySelector(".res-hero").textContent.trim();
    const cardRows = target.querySelectorAll(".card-label");
    const cards = Array.from(cardRows).map(el => el.textContent.trim());

    return {
        index,
        name,
        mode: "random",
        hero: "",
        heroResult: hero,
        cardsResult: cards,
        team: target.classList.contains("team-red") ? "red" : "blue"
    };
}

/* =========================================================
   ログ保存
========================================================= */

function saveLog(players) {
    const oldLogs = JSON.parse(localStorage.getItem("deckRouletteLogs") || "[]");

    const log = {
        date: new Date().toLocaleString("ja-JP"),
        players: players.map(p => ({
            index: p.index,
            name: p.name,
            hero: p.heroResult,
            cards: [...p.cardsResult],
            team: p.team
        }))
    };

    oldLogs.unshift(log);
    const limited = oldLogs.slice(0, 100);
    localStorage.setItem("deckRouletteLogs", JSON.stringify(limited));
}

function addRerollLog(index, type, value) {
    const logs = JSON.parse(localStorage.getItem("deckRouletteLogs") || "[]");
    if (!logs.length) return;

    const log = logs[0];
    let player = log.players.find(p => Number(p.index) === Number(index));
    if (!player) player = log.players[index];
    if (!player) return;

    player.rerolls = Array.isArray(player.rerolls) ? player.rerolls : [];
    player.rerolls.push({
        type: type,
        value: Array.isArray(value) ? [...value] : value,
        date: new Date().toLocaleTimeString("ja-JP")
    });

    if (type === "hero") player.hero = value;
    if (type === "cards") player.cards = [...value];

    localStorage.setItem("deckRouletteLogs", JSON.stringify(logs));
    renderLogs();
}

/* =========================================================
   ログ表示
========================================================= */

function renderLogs() {
    const area = document.getElementById("logArea");
    const logs = JSON.parse(localStorage.getItem("deckRouletteLogs") || "[]");

    if (logs.length === 0) {
        area.innerHTML = `<div class="no-log">まだ抽選ログはありません</div>`;
        return;
    }

    area.innerHTML = logs.map(log => `
        <div class="log-item">
            <div class="log-date">${escapeHtml(log.date)}</div>
            ${log.players.map(p => `
                <div class="log-player">${escapeHtml(p.name)}</div>
                <div class="log-detail">
                    チーム：${p.team === "red" ? "赤" : "青"}<br>
                    ヒーロー：${escapeHtml(p.hero)}<br>
                    カード：${p.cards.map(c => escapeHtml(c)).join(" / ")}
                    ${
                        Array.isArray(p.rerolls) && p.rerolls.length
                            ? `<br><strong>リロール履歴：</strong><br>${
                                p.rerolls.map(r =>
                                    `${r.type === "hero" ? "ヒーロー" : "カード"}をリロール → ${
                                        Array.isArray(r.value)
                                            ? r.value.map(v => escapeHtml(v)).join(" / ")
                                            : escapeHtml(String(r.value))
                                    }`
                                ).join("<br>")
                            }`
                            : ""
                    }
                </div>
            `).join("")}
        </div>
    `).join("");
}

/* =========================================================
   ログ削除
========================================================= */

function clearLogs() {
    if (!confirm("保存されている抽選ログをすべて削除しますか？")) return;
    localStorage.removeItem("deckRouletteLogs");
    renderLogs();
}

/* =========================================================
   初期化
========================================================= */

window.addEventListener("DOMContentLoaded", () => {
    const tpl = document.getElementById("heroOptions");
    const dummySelect = document.createElement("select");

    dummySelect.appendChild(tpl.content.cloneNode(true));

    globalAllHeroes = Array.from(dummySelect.options)
        .map(opt => opt.text)
        .filter(text => text !== "キャラを選択してね");

    // 当たり枠カード用セレクトボックス生成
    const targetCardSelect = document.getElementById("targetCardSelect");
    cardTypes.forEach(type => {
        const opt = document.createElement("option");
        opt.value = type;
        opt.textContent = type;
        if (type === "設置") opt.selected = true;
        targetCardSelect.appendChild(opt);
    });

    loadPresets();
    renderPresets();
    buildProbabilityControls();
    buildPlayerInputs();
    renderLogs();
    
    // 初期状態の表示切替
    toggleEffectOption();
});
