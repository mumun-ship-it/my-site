<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>デッキルーレット</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;

    max-width: 840px;
    margin: 30px auto;
    padding: 0 20px;

    color: #2c3e50;
    background: #f8f9fa;
}

h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 24px;
    text-align: center;
    color: #1a252f;
    letter-spacing: 1px;
}


/* =========================
   レイアウト
========================= */

.app-container {
    display: flex;
    gap: 24px;
    align-items: flex-start;
}

.main-sec {
    flex: 1;
    min-width: 0;
}

.side-sec {
    width: 240px;
    flex-shrink: 0;

    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;

    padding: 18px;
    height: fit-content;
}

.side-sec h2 {
    font-size: 14px;
    font-weight: 700;

    margin: 0 0 12px;
    padding-bottom: 8px;

    border-bottom: 1px solid #e2e8f0;
    color: #4a5568;
}


/* =========================
   プレイヤー設定
========================= */

.player-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;

    padding: 14px 16px;
    margin-bottom: 12px;

    width: 100%;
}

.card-title {
    font-size: 13px;
    font-weight: 700;

    color: #718096;

    border-bottom: 1px solid #edf2f7;

    padding-bottom: 6px;
    margin-bottom: 10px;

    text-transform: uppercase;
    letter-spacing: 0.5px;
}

label {
    display: block;

    font-size: 12px;
    font-weight: 600;

    margin: 10px 0 4px;

    color: #4a5568;
}

input[type="text"],
select {
    width: 100%;

    padding: 9px 12px;

    font-size: 14px;

    border: 1px solid #cbd5e0;
    border-radius: 6px;

    background: #fff;
    color: #2d3748;

    transition:
        border-color 0.15s ease;
}

input[type="text"]:focus,
select:focus {
    outline: none;
    border-color: #4299e1;
}

.mode-select {
    margin: 10px 0 6px;
}

.mode-select label {
    display: inline-flex;

    align-items: center;
    gap: 6px;

    font-weight: 500;

    margin-right: 16px;

    cursor: pointer;
}

.hero-box {
    margin-top: 8px;
    display: none;
}


/* =========================
   確率設定
========================= */

.probability-box {
    margin-top: 16px;

    border: 1px solid #e2e8f0;
    border-radius: 6px;

    background: #fff;
}

.probability-box summary {
    padding: 10px;

    font-size: 13px;
    font-weight: 600;

    cursor: pointer;

    color: #4a5568;
}

.probability-list {
    padding: 10px;

    border-top: 1px solid #edf2f7;
}

.prob-item {
    margin-bottom: 12px;
}

.prob-header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    font-size: 12px;
    font-weight: 600;

    color: #4a5568;

    margin-bottom: 5px;
}

.prob-value {
    font-size: 11px;
    color: #718096;
}

.prob-slider {
    width: 100%;
    margin: 0;
    cursor: pointer;
}

.prob-scale {
    display: flex;

    justify-content: space-between;

    font-size: 9px;

    color: #a0aec0;

    padding: 0 2px;
}

.reset-btn {
    width: 100%;

    margin-top: 10px;
    padding: 6px;

    font-size: 12px;
    font-weight: 600;

    cursor: pointer;

    background: #edf2f7;
    color: #4a5568;

    border: none;
    border-radius: 4px;
}


/* =========================
   START
========================= */

.btn-start {
    width: 100%;

    padding: 14px;

    font-size: 16px;
    font-weight: 700;

    letter-spacing: 1px;

    background: #2b6cb0;
    color: #ffffff;

    border: none;
    border-radius: 8px;

    cursor: pointer;

    margin-top: 12px;

    transition:
        background-color 0.15s ease;
}

.btn-start:hover {
    background: #2c5282;
}

.btn-start:disabled {
    background: #a0aec0;
    cursor: not-allowed;
}


/* =========================
   演出ON/OFF
========================= */

.effect-option {
    margin-top: 16px;

    padding: 10px;

    border: 1px solid #e2e8f0;
    border-radius: 6px;

    background: #fff;
}

.effect-option label {
    display: flex;

    align-items: center;
    gap: 8px;

    margin: 0;

    cursor: pointer;
}


/* =========================
   結果
========================= */

#resultArea {
    margin-top: 28px;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 20px;

    align-items: start;
}

.player-res {
    position: relative;

    background: #ffffff;

    border: 3px solid #e2e8f0;
    border-radius: 12px;

    padding: 14px 16px 16px;

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease;
}

.player-res.team-red {
    border-color: #e53e3e;
}

.player-res.team-blue {
    border-color: #3182ce;
}


/* =========================
   結果ヘッダー
========================= */

.res-header {
    border-bottom: 1px solid #edf2f7;

    padding-bottom: 10px;
    margin-bottom: 10px;

    position: relative;
}

.res-pname {
    font-size: 11px;
    font-weight: 600;

    color: #718096;

    letter-spacing: 0.5px;

    display: block;

    margin-bottom: 5px;
}

.res-hero {
    font-size: 18px;
    font-weight: 700;

    color: #1a202c;

    line-height: 1.35;

    min-height: 48px;

    display: flex;
    align-items: center;

    word-break: break-word;
}


/* =========================
   リロールボタン
========================= */

.result-actions {
    display: flex;

    justify-content: flex-end;

    gap: 5px;

    margin-bottom: 10px;
}

.btn-reroll-hero,
.btn-reroll-card {
    border: 1px solid #cbd5e0;

    background: #f7fafc;
    color: #4a5568;

    border-radius: 5px;

    padding: 4px 7px;

    font-size: 10px;
    font-weight: 600;

    cursor: pointer;

    transition: all 0.15s ease;
}

.btn-reroll-hero:hover,
.btn-reroll-card:hover {
    background: #edf2f7;
    border-color: #a0aec0;
}


/* =========================
   カード結果
========================= */

.res-cards {
    display: flex;

    flex-direction: column;

    gap: 6px;
}

.card-row {
    display: flex;

    align-items: center;

    border-radius: 5px;

    overflow: hidden;

    min-height: 38px;
}

.card-num {
    width: 30px;
    min-width: 30px;

    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 11px;
    font-weight: 700;

    background: rgba(0, 0, 0, 0.15);

    color: #ffffff;
}

.card-label {
    flex: 1;

    padding: 6px 10px;

    font-size: 12px;
    font-weight: 600;

    color: #ffffff;

    display: flex;

    align-items: center;

    min-height: 38px;
}


/* =========================
   カードタイプ色
========================= */

.type-近距離 .card-row {
    background: #e53e3e;
}

.type-遠距離 .card-row {
    background: #dd6b20;
}

.type-連続 .card-row {
    background: #9b2c2c;
}

.type-周囲 .card-row {
    background: #c05621;
}

.type-回復 .card-row {
    background: #38a169;
}

.type-ガード .card-row {
    background: #d69e2e;
}

.type-強化 .card-row {
    background: #00a3c4;
}

.type-弱体化 .card-row {
    background: #6b46c1;
}

.type-移動 .card-row {
    background: #3182ce;
}

.type-設置 .card-row {
    background: #234e52;
}

.type-カウンター .card-row {
    background: #d53f8c;
}

.type-その他 .card-row {
    background: #4a5568;
}


/* =========================
   アニメーション
========================= */

.anim-fade {
    opacity: 0;

    transform: translateY(8px);

    animation:
        fadeIn 0.4s ease forwards;
}

@keyframes fadeIn {

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* =========================
   ルーレット
========================= */

#rouletteOverlay {
    position: fixed;

    inset: 0;

    z-index: 9999;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(15, 23, 42, 0.94);

    padding: 20px;
}

#rouletteOverlay.show {
    display: flex;
}

.roulette-window {
    width: min(560px, 100%);

    background: #ffffff;

    border-radius: 18px;

    padding: 30px 24px;

    text-align: center;

    box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.35);
}

.roulette-player {
    font-size: 14px;

    color: #718096;

    margin-bottom: 12px;
}

.roulette-title {
    font-size: 18px;
    font-weight: 700;

    color: #2d3748;

    margin-bottom: 18px;
}

.roulette-slot {
    position: relative;

    height: 110px;

    overflow: hidden;

    border-radius: 12px;

    border: 2px solid #cbd5e0;

    background: #f7fafc;

    display: flex;

    align-items: center;
    justify-content: center;

    transition:
        background-color 0.12s ease,
        border-color 0.12s ease,
        box-shadow 0.12s ease;
}

.roulette-value {
    font-size: 28px;
    font-weight: 800;

    color: #1a202c;

    padding: 10px 20px;

    word-break: break-word;

    transition:
        color 0.12s ease;
}

.roulette-card-list {
    margin-top: 12px;

    font-size: 13px;

    color: #718096;
}


/* =========================
   ルーレット チーム色
========================= */

.roulette-slot.team-red {
    background: #e53e3e;
    border-color: #c53030;

    box-shadow:
        0 0 25px
        rgba(229, 62, 62, 0.45);
}

.roulette-slot.team-blue {
    background: #3182ce;
    border-color: #2b6cb0;

    box-shadow:
        0 0 25px
        rgba(49, 130, 206, 0.45);
}

.roulette-slot.team-red .roulette-value,
.roulette-slot.team-blue .roulette-value {
    color: #ffffff;
}


/* =========================
   ルーレット カード色
========================= */

.roulette-slot.type-近距離 {
    background: #e53e3e;
    border-color: #c53030;

    box-shadow:
        0 0 25px
        rgba(229, 62, 62, 0.45);
}

.roulette-slot.type-遠距離 {
    background: #dd6b20;
    border-color: #c05621;

    box-shadow:
        0 0 25px
        rgba(221, 107, 32, 0.45);
}

.roulette-slot.type-連続 {
    background: #9b2c2c;
    border-color: #742a2a;

    box-shadow:
        0 0 25px
        rgba(155, 44, 44, 0.45);
}

.roulette-slot.type-周囲 {
    background: #c05621;
    border-color: #9c4221;

    box-shadow:
        0 0 25px
        rgba(192, 86, 33, 0.45);
}

.roulette-slot.type-回復 {
    background: #38a169;
    border-color: #2f855a;

    box-shadow:
        0 0 25px
        rgba(56, 161, 105, 0.45);
}

.roulette-slot.type-ガード {
    background: #d69e2e;
    border-color: #b7791f;

    box-shadow:
        0 0 25px
        rgba(214, 158, 46, 0.45);
}

.roulette-slot.type-強化 {
    background: #00a3c4;
    border-color: #0987a0;

    box-shadow:
        0 0 25px
        rgba(0, 163, 196, 0.45);
}

.roulette-slot.type-弱体化 {
    background: #6b46c1;
    border-color: #553c9a;

    box-shadow:
        0 0 25px
        rgba(107, 70, 193, 0.45);
}

.roulette-slot.type-移動 {
    background: #3182ce;
    border-color: #2b6cb0;

    box-shadow:
        0 0 25px
        rgba(49, 130, 206, 0.45);
}

.roulette-slot.type-設置 {
    background: #234e52;
    border-color: #1a3b3e;

    box-shadow:
        0 0 25px
        rgba(35, 78, 82, 0.45);
}

.roulette-slot.type-カウンター {
    background: #d53f8c;
    border-color: #b83280;

    box-shadow:
        0 0 25px
        rgba(213, 63, 140, 0.45);
}

.roulette-slot.type-その他 {
    background: #4a5568;
    border-color: #2d3748;

    box-shadow:
        0 0 25px
        rgba(74, 85, 104, 0.45);
}

.roulette-slot[class*="type-"] .roulette-value {
    color: #ffffff;
}


/* =========================
   ルーレット光り
========================= */

.roulette-glow {
    animation:
        rouletteGlow 0.18s infinite alternate;
}

@keyframes rouletteGlow {

    from {
        transform: scale(0.98);
        opacity: 0.75;
    }

    to {
        transform: scale(1.03);
        opacity: 1;
    }

}


/* =========================
   決定演出
========================= */

.dopagaki-flash {
    animation:
        dopagakiFlash 0.18s ease;
}

@keyframes dopagakiFlash {

    0% {
        transform: scale(1);
        filter: brightness(1);
    }

    50% {
        transform: scale(1.04);
        filter: brightness(1.7);
    }

    100% {
        transform: scale(1);
        filter: brightness(1);
    }

}


/* =========================
   ログ
========================= */

.log-box {
    margin-top: 28px;

    background: #ffffff;

    border: 1px solid #e2e8f0;
    border-radius: 12px;

    padding: 16px;
}

.log-box summary {
    cursor: pointer;

    font-size: 14px;
    font-weight: 700;

    color: #4a5568;
}

.log-controls {
    display: flex;

    justify-content: flex-end;

    gap: 8px;

    margin: 12px 0;
}

.log-btn {
    padding: 6px 10px;

    border: 1px solid #cbd5e0;

    background: #f7fafc;

    border-radius: 6px;

    cursor: pointer;

    font-size: 11px;
}

.log-item {
    border-top: 1px solid #edf2f7;

    padding: 12px 0;
}

.log-date {
    font-size: 11px;

    color: #a0aec0;

    margin-bottom: 6px;
}

.log-player {
    font-size: 13px;
    font-weight: 700;

    color: #2d3748;

    margin-bottom: 4px;
}

.log-detail {
    font-size: 12px;

    color: #718096;

    line-height: 1.6;
}

.no-log {
    font-size: 12px;

    color: #a0aec0;

    text-align: center;

    padding: 15px;
}


/* =========================
   スマホ
========================= */

@media (max-width: 640px) {

    body {
        margin: 18px auto;
        padding: 0 10px;
    }

    .app-container {
        flex-direction: column;
    }

    .side-sec {
        width: 100%;
    }

    #resultArea {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 8px;
    }

    .player-res {
        padding: 11px 10px 12px;
    }

    .res-hero {
        font-size: 15px;
        min-height: 42px;
    }

    .res-pname {
        font-size: 10px;
    }

    .result-actions {
        gap: 3px;
    }

    .btn-reroll-hero,
    .btn-reroll-card {
        padding: 3px 5px;
        font-size: 9px;
    }

    .card-row {
        min-height: 34px;
    }

    .card-num {
        width: 25px;
        min-width: 25px;

        height: 34px;

        font-size: 9px;
    }

    .card-label {
        min-height: 34px;

        padding: 5px 6px;

        font-size: 10px;
    }

    .roulette-window {
        padding: 24px 16px;
    }

    .roulette-value {
        font-size: 22px;
    }

    .roulette-slot {
        height: 100px;
    }

}

</style>

</head>

<h1>デッキルーレット</h1>


<div class="app-container">


<div class="main-sec">

    <div id="playerList"></div>


    <button
        id="startBtn"
        class="btn-start"
        onclick="drawDeck()"
    >
        START
    </button>


    <div id="resultArea"></div>


    <details class="log-box">

        <summary>
            抽選ログ
        </summary>

        <div class="log-controls">

            <button
                class="log-btn"
                onclick="clearLogs()"
            >
                ログを削除
            </button>

        </div>

        <div id="logArea"></div>

    </details>

</div>


<div class="side-sec">

    <h2>
        オプション
    </h2>


    <label for="memberCount">
        人数
    </label>

    <select
        id="memberCount"
        onchange="buildPlayerInputs()"
    >

/* =========================================================
   基本データ
========================================================= */

let globalAllHeroes = [];


const cardTypes = [

    "遠距離",

    "周囲",

/* =========================================================
   音
========================================================= */

let audioContext = null;


function initAudio() {

    if (!audioContext) {

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if (AudioCtx) {

            audioContext =
                new AudioCtx();

        }

    }

    if (
        audioContext &&
        audioContext.state === "suspended"
    ) {

        audioContext.resume();

    }

}


function playTick() {

    if (!audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "square";

    oscillator.frequency.setValueAtTime(
        650,
        audioContext.currentTime
    );

    gain.gain.setValueAtTime(
        0.035,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.045
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.05
    );

}


function playDecisionSound() {

    if (!audioContext) return;

    const now =
        audioContext.currentTime;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
        520,
        now
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        880,
        now + 0.12
    );

    gain.gain.setValueAtTime(
        0.08,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.25
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        now + 0.26
    );

}


/* =========================================================
   プレイヤー入力

/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(str) {

    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

/* =========================================================
   確率UI
========================================================= */

function buildProbabilityControls() {

    const container =
        document.getElementById(
            "probabilityControls"
        );


    container.innerHTML = "";


    cardTypes.forEach(type => {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "prob-item";


        div.innerHTML = `

            <div class="prob-header">

                <span>
                    ${type}
                </span>

                <span
                    class="prob-value"
                    id="probValue_${type}"
                ></span>

            </div>

                class="prob-slider"
                type="range"
                min="1"
                max="5"
                step="1"
                value="${probabilities[type]}"
                oninput="
                    updateProbability(
                        '${type}',
                        this.value
                    )
                "
            >

                <span>2</span>

                <span>4</span>
                <span>5</span>

            </div>

        `;


        container.appendChild(div);

}


function getProbabilityWeight(level) {

    return (level - 1) * 5;

}


function updateProbability(type, value) {

    probabilities[type] =
        parseInt(
            value,
            10
        );

    updateProbabilityLabel(type);

}


function updateProbabilityLabel(type) {

    const value =
        probabilities[type];


    const labels = {

        1: "0%",
        2: "5%",
        3: "10%",
        4: "15%",
        5: "20%"

    };


    const el =
        document.getElementById(
            `probValue_${type}`
        );


    if (el) {

        el.textContent =
            labels[value];

    }

}


function resetProbabilities() {

    cardTypes.forEach(type => {

        probabilities[type] = 3;

    });


    buildProbabilityControls();

}


/* =========================================================
   重み付き抽選
========================================================= */

function pickWeightedCard() {

    const entries =
        cardTypes
            .map(type => ({

                type,

                weight:
                    getProbabilityWeight(
                        probabilities[type]
                    )

            }))
            .filter(
                item =>
                    item.weight > 0
            );


    if (entries.length === 0) {

        return cardTypes[
            Math.floor(
                Math.random() *
                cardTypes.length
            )
        ];

    }


    const total =
        entries.reduce(
            (sum, item) =>
                sum + item.weight,
            0
        );


    let random =
        Math.random() * total;


    for (const item of entries) {

        random -= item.weight;


        if (random <= 0) {

            return item.type;

        }

    }


    return entries[
        entries.length - 1
    ].type;

}


/* =========================================================
   カード生成
========================================================= */

function createCards() {

    const pickedCards = [];


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        pickedCards.push(
            pickWeightedCard()
        );

    }


    return pickedCards;

}

/* =========================================================
   チーム分け
   プレイヤー順は変えず、
   赤青の割り当てだけランダム化
========================================================= */

function getTeamAssignments(total) {

    const redCount =
        Math.ceil(total / 2);

    const teams = [];


    for (
        let i = 0;
        i < redCount;
        i++
    ) {

        teams.push("red");

    }


    for (
        let i = redCount;
        i < total;
        i++
    ) {

        teams.push("blue");

    }


    /*
       Fisher-Yatesシャッフル

       プレイヤー自体は移動させず、
       チームだけランダムにする。
    */

    for (
        let i = teams.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            teams[i],
            teams[j]
        ] = [
            teams[j],
            teams[i]
        ];

    }


    return teams;

}


/* =========================================================
   待機
========================================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================================================
   ルーレット色変更
========================================================= */

function setRouletteColor(className) {

    const slot =
        document.getElementById(
            "rouletteSlot"
        );


    slot.className =
        "roulette-slot";


    if (className) {

        slot.classList.add(
            className
        );

    }

}


/* =========================================================
   ヒーロールーレット
========================================================= */

async function rouletteAnimation(
    playerName,
    title,
    values,
    finalValue,
    team
) {

    const overlay =
        document.getElementById(
            "rouletteOverlay"
        );


    const player =
        document.getElementById(
            "roulettePlayer"
        );


    const titleEl =
        document.getElementById(
            "rouletteTitle"
        );


    const valueEl =
        document.getElementById(
            "rouletteValue"
        );


    const cardList =
        document.getElementById(
            "rouletteCardList"
        );


    player.textContent =
        `${playerName} のルーレット`;


    titleEl.textContent =
        title;


    cardList.textContent =
        "";


    overlay.classList.add(
        "show"
    );


    /*
       ヒーローはチーム色
    */

    setRouletteColor(
        team
            ? `team-${team}`
            : ""
    );


    valueEl.classList.add(
        "roulette-glow"
    );


    /* =========================
       高速回転
    ========================= */

    for (
        let i = 0;
        i < 22;
        i++
    ) {

        const random =
            values[
                Math.floor(
                    Math.random() *
                    values.length
                )
            ];


        valueEl.textContent =
            random;


        playTick();


        await wait(
            Math.max(
                35,
                100 - i * 3
            )
        );

    }


    /* =========================
       減速
    ========================= */

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        valueEl.textContent =
            values[
                Math.floor(
                    Math.random() *
                    values.length
                )
            ];


        playTick();


        await wait(
            130 + i * 45
        );

    }


    /* =========================
       決定
    ========================= */

    valueEl.textContent =
        finalValue;


    valueEl.classList.remove(
        "roulette-glow"
    );


    /*
       決定時もチーム色を維持
    */

    setRouletteColor(
        team
            ? `team-${team}`
            : ""
    );


    playDecisionSound();


    if (
        document.getElementById(
            "effectToggle"
        ).checked
    ) {

        valueEl.classList.add(
            "dopagaki-flash"
        );


        await wait(220);


        valueEl.classList.remove(
            "dopagaki-flash"
        );


        await wait(550);

    } else {

        await wait(900);

    }


    overlay.classList.remove(
        "show"
    );

}


/* =========================================================
   カードルーレット
========================================================= */

async function rouletteCardsAnimation(
    playerName,
    finalCards
) {

    const overlay =
        document.getElementById(
            "rouletteOverlay"
        );


    const player =
        document.getElementById(
            "roulettePlayer"
        );


    const title =
        document.getElementById(
            "rouletteTitle"
        );


    const value =
        document.getElementById(
            "rouletteValue"
        );


    const cardList =
        document.getElementById(
            "rouletteCardList"
        );


    player.textContent =
        `${playerName} のルーレット`;


    overlay.classList.add(
        "show"
    );


    for (
        let i = 0;
        i < finalCards.length;
        i++
    ) {

        title.textContent =
            `カード ${i + 1}枚目`;


        cardList.textContent =
            `${i + 1} / ${finalCards.length} 枚目を抽選中`;


        value.classList.add(
            "roulette-glow"
        );


        /* =========================
           高速回転
        ========================= */

        for (
            let j = 0;
            j < 22;
            j++
        ) {

            const randomCard =
                pickWeightedCard();


            value.textContent =
                randomCard;


            /*
               回転中もカード色を変更
            */

            setRouletteColor(
                `type-${randomCard}`
            );


            playTick();


            await wait(
                Math.max(
                    35,
                    100 - j * 3
                )
            );

        }


        /* =========================
           減速
        ========================= */

        for (
            let j = 0;
            j < 5;
            j++
        ) {

            const randomCard =
                pickWeightedCard();


            value.textContent =
                randomCard;


            /*
               減速中も色変更
            */

            setRouletteColor(
                `type-${randomCard}`
            );


            playTick();


            await wait(
                130 + j * 45
            );

        }


        /* =========================
           決定
        ========================= */

        value.textContent =
            finalCards[i];


        /*
           決定したカードの色
        */

        setRouletteColor(
            `type-${finalCards[i]}`
        );


        value.classList.remove(
            "roulette-glow"
        );


        playDecisionSound();


        if (
            document.getElementById(
                "effectToggle"
            ).checked
        ) {

            value.classList.add(
                "dopagaki-flash"
            );


            await wait(220);


            value.classList.remove(
                "dopagaki-flash"
            );

        }


        await wait(400);

    }


    title.textContent =
        "カード抽選完了";


    cardList.textContent =
        "4枚のカードが決まりました";


    await wait(700);


    overlay.classList.remove(
        "show"
    );

}


/* =========================================================
   全体抽選
========================================================= */

async function drawDeck() {

    /*
       音声開始
    */

    initAudio();


    const count =
        parseInt(
            document.getElementById(
                "memberCount"
            ).value,
            10
        );


    const cards =
        document.querySelectorAll(
            ".player-card"
        );


    const resultBox =
        document.getElementById(
            "resultArea"
        );


    resultBox.innerHTML =
        "";


    const startBtn =
        document.getElementById(
            "startBtn"
        );


    startBtn.disabled =
        true;


    const players = [];


    /*
       ★ ここでチームだけランダム決定
    */

    const teamAssignments =
        getTeamAssignments(count);


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const card =
            cards[i];


        let name =
            card
                .querySelector(
                    ".p-name"
                )
                .value
                .trim();


        const mode =
            card
                .querySelector(
                    'input[type="radio"]:checked'
                )
                .value;


        const hero =
            card
                .querySelector(
                    ".p-hero"
                )
                .value;


        if (!name) {

            name =
                count === 1
                    ? "名無し"
                    : `名無し${i + 1}`;

        }


        if (
            mode === "select" &&
            !hero
        ) {

            alert(
                `${i + 1}人目のキャラが選ばれてません！`
            );


            startBtn.disabled =
                false;


            return;

        }


        const playerData = {

            index: i,

            name,

            mode,

            hero,

            heroResult:
                mode === "select"
                    ? hero
                    : globalAllHeroes[
                        Math.floor(
                            Math.random() *
                            globalAllHeroes.length
                        )
                    ],

            cardsResult:
                createCards(),

            /*
               プレイヤー順はそのまま
               チームだけランダム
            */

            team:
                teamAssignments[i]

        };


        players.push(
            playerData
        );

    }


    /* =========================
       一人ずつ抽選
    ========================= */

    for (
        let i = 0;
        i < players.length;
        i++
    ) {

        const p =
            players[i];


        if (
            document.getElementById(
                "effectToggle"
            ).checked
        ) {

            /* =========================
               ヒーロー
            ========================= */

            await rouletteAnimation(

                p.name,

                p.mode === "random"
                    ? "ヒーロー抽選"
                    : "ヒーロー確認",

                globalAllHeroes,

                p.heroResult,

                p.team

            );


            /* =========================
               カード
            ========================= */

            await rouletteCardsAnimation(

                p.name,

                p.cardsResult

            );

        }


        const pBlock =
            document.createElement(
                "div"
            );


        pBlock.className =
            `player-res anim-fade team-${p.team}`;


        pBlock.id =
            `resBlock_${p.index}`;


        pBlock.__playerData =
            p;


        resultBox.appendChild(
            pBlock
        );


        renderPlayerResult(
            p,
            pBlock
        );


        await wait(350);

    }


    saveLog(players);

    renderLogs();


    startBtn.disabled =
        false;

}


/* =========================================================
   ヒーローリロール
========================================================= */

async function rerollHero(index) {

    initAudio();


    const cards =
        document.querySelectorAll(
            ".player-card"
        );


    const card =
        cards[index];


    if (!card) return;


    const name =
        card
            .querySelector(
                ".p-name"
            )
            .value
            .trim() ||
        `名無し${index + 1}`;


    const mode =
        card
            .querySelector(
                'input[type="radio"]:checked'
            )
            .value;


    const hero =
        globalAllHeroes[
            Math.floor(
                Math.random() *
                globalAllHeroes.length
            )
        ];


    const target =
        document.getElementById(
            `resBlock_${index}`
        );


    if (!target) return;


    const current =
        target.__playerData ||
        getPlayerDataFromResult(
            target,
            index,
            name
        );


    /*
       選択モードなら固定キャラ
       ランダムなら新しく抽選
    */

    const finalHero =
        mode === "select"
            ? card.querySelector(
                ".p-hero"
            ).value
            : hero;


    /*
       ルーレット演出
    */

    if (
        document.getElementById(
            "effectToggle"
        ).checked
    ) {

        await rouletteAnimation(

            name,

            mode === "select"
                ? "ヒーロー確認"
                : "ヒーローリロール",

            globalAllHeroes,

            finalHero,

            current.team

        );

    }


    current.heroResult =
        finalHero;


    current.name =
        name;


    target.__playerData =
        current;


    renderPlayerResult(
        current,
        target
    );

}


/* =========================================================
   カードリロール
========================================================= */

async function rerollCards(index) {

    initAudio();


    const cards =
        document.querySelectorAll(
            ".player-card"
        );


    const card =
        cards[index];


    if (!card) return;


    const name =
        card
            .querySelector(
                ".p-name"
            )
            .value
            .trim() ||
        `名無し${index + 1}`;


    const newCards =
        createCards();


    const target =
        document.getElementById(
            `resBlock_${index}`
        );


    if (!target) return;


    if (
        document.getElementById(
            "effectToggle"
        ).checked
    ) {

        await rouletteCardsAnimation(

            name,

            newCards

        );

    }


    const current =
        target.__playerData ||
        getPlayerDataFromResult(
            target,
            index,
            name
        );


    current.cardsResult =
        newCards;


    current.name =
        name;


    target.__playerData =
        current;


    renderPlayerResult(
        current,
        target
    );

}


/* =========================================================
   結果からデータ復元
========================================================= */

function getPlayerDataFromResult(
    target,
    index,
    name
) {

    const hero =
        target
            .querySelector(
                ".res-hero"
            )
            .textContent
            .trim();


    const cardRows =
        target.querySelectorAll(
            ".card-label"
        );


    const cards =
        Array.from(
            cardRows
        ).map(
            el =>
                el.textContent.trim()
        );


    return {

        index,

        name,

        mode: "random",

        hero: "",

        heroResult: hero,

        cardsResult: cards,

        team:
            target.classList.contains(
                "team-red"
            )
                ? "red"
                : "blue"

    };

}


/* =========================================================
   ログ保存
========================================================= */

function saveLog(players) {

    const oldLogs =
        JSON.parse(
            localStorage.getItem(
                "deckRouletteLogs"
            ) || "[]"
        );


    const log = {

        date:
            new Date().toLocaleString(
                "ja-JP"
            ),

        players:
            players.map(
                p => ({

                    name: p.name,

                    hero:
                        p.heroResult,

                    cards: [
                        ...p.cardsResult
                    ],

                    team:
                        p.team

                })
            )

    };


    oldLogs.unshift(
        log
    );


    const limited =
        oldLogs.slice(
            0,
            100
        );


    localStorage.setItem(

        "deckRouletteLogs",

        JSON.stringify(
            limited
        )

    );

}


/* =========================================================
   ログ表示
========================================================= */

function renderLogs() {

    const area =
        document.getElementById(
            "logArea"
        );


    const logs =
        JSON.parse(
            localStorage.getItem(
                "deckRouletteLogs"
            ) || "[]"
        );


    if (
        logs.length === 0
    ) {

        area.innerHTML = `

            <div class="no-log">

                まだ抽選ログはありません

            </div>

        `;

        return;

    }


    area.innerHTML =

        logs.map(
            log => `

                <div class="log-item">

                    <div class="log-date">

                        ${escapeHtml(
                            log.date
                        )}

                    </div>


                    ${log.players.map(

                        p => `

                            <div class="log-player">

                                ${escapeHtml(
                                    p.name
                                )}

                            </div>


                            <div class="log-detail">

                                ヒーロー：

                                ${escapeHtml(
                                    p.hero
                                )}

                                <br>

                                カード：

                                ${p.cards
                                    .map(
                                        c =>
                                            escapeHtml(
                                                c
                                            )
                                    )
                                    .join(
                                        " / "
                                    )}

                            </div>

                        `

                    ).join("")}

                </div>

            `
        ).join("");

}


/* =========================================================
   ログ削除
========================================================= */

function clearLogs() {

    if (
        !confirm(
            "保存されている抽選ログをすべて削除しますか？"
        )
    ) {

        return;

    }


    localStorage.removeItem(
        "deckRouletteLogs"
    );


    renderLogs();

}


/* =========================================================
   初期化
========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    () => {

        const tpl =
            document.getElementById(
                "heroOptions"
            );


        const dummySelect =
            document.createElement(
                "select"
            );


        dummySelect.appendChild(
            tpl.content.cloneNode(
                true
            )
        );


        globalAllHeroes =
            Array.from(
                dummySelect.options
            )
            .map(
                opt =>
                    opt.text
            )
            .filter(
                text =>
                    text !==
                    "キャラを選択してね"
            );


        buildProbabilityControls();

        buildPlayerInputs();

        renderLogs();

    }
);

</script>
